  evidence: >-
    developers.fivestars.com and docs.fivestars.com do not resolve in DNS.
    api.fivestars.com resolves (via fivestars-edge.fleet.live.us-east-1.sumup.net)
    but returns HTTP 404 on /openapi.json, /openapi.yaml, /swagger.json,
    /v1/openapi.json, /api-docs, /docs, /redoc and every /.well-known/ path.
    www.fivestars.com/developers, /developer, /api and /api-docs all return 404.
    The Wayback Machine holds no capture of developers.fivestars.com or of
    fivestars.com/developers at any point; the only archived /api paths are
    internal /admin/api/* merchant-admin pages that 301'd.
  remaining_client_surface: >-
    One first-party client library survives: TapiSDK for iOS (see
    packages/fivestars-packages.yml), a Terminal API wrapper described in its own
    README as being "for legacy Fivestars integrators including loyalty with
    cPay". Last release 0.0.6 on 2024-05-16. It is distributed to integrators
    from the company's GitHub org, not through a public developer program.

note: >-
  Fivestars was acquired by SumUp in 2021 and the product is now marketed as
  SumUp Connect / SumUp Loyalty. This artifact records the lifecycle of the
  FIVESTARS surface only. There is no published API versioning policy, no
  deprecation policy, and no RFC 8594 Sunset/Deprecation header contract to
  record — no public API contract exists to version. What Fivestars does still
  operate is a real, publicly reachable status page and a Fivestars-branded
  legal surface, both of which are captured here.

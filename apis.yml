name: Fivestars
description: >-
  Fivestars was a customer loyalty, rewards, and payments platform for small and
  mid-sized brick-and-mortar merchants, founded in 2010 and headquartered in San
  Francisco. It combined an automated marketing engine, a customer loyalty and
  rewards program, and integrated card payments so local businesses could turn
  one-time shoppers into repeat customers. Fivestars was backed by Lightspeed
  Venture Partners, Menlo Ventures, and Y Combinator. The company was acquired by
  SumUp in 2021 and its product has since been folded into SumUp Connect (SumUp
  Loyalty); fivestars.com now redirects to SumUp's loyalty program. Fivestars
  publishes no public API, no developer portal and no machine-readable contract —
  api.fivestars.com resolves but returns 404 on every spec and well-known path,
  and developers.fivestars.com does not resolve. Fivestars-branded surfaces that
  remain live include the marketing site, merchant dashboard, help center and a
  public status page, plus one first-party iOS library (TapiSDK) for legacy cPay
  terminal integrators. This profile is retained in the API Evangelist network as
  a historical company record.

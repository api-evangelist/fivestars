name: Fivestars
description: >-
  Fivestars was a customer loyalty, rewards, and payments platform for small and
  mid-sized brick-and-mortar merchants, founded in 2010 and headquartered in San
  Francisco. It combined an automated marketing engine, a customer loyalty and
  rewards program, and integrated card payments so local businesses could turn
  one-time shoppers into repeat customers. Fivestars was backed by Lightspeed
  Venture Partners, Menlo Ventures, and Y Combinator, and historically operated a
  developer program exposing loyalty, promotions, and customer APIs. The company
  was acquired by SumUp in 2021 and its product has since been folded into SumUp
  Connect (SumUp Loyalty); the fivestars.com domain now redirects to SumUp's
  loyalty program and the standalone Fivestars developer portal and public APIs
  have been retired. This profile is retained in the API Evangelist network as a
  historical company record.
